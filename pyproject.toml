[project]
name = "explorerpro"
version = "1.0.6"
description = "Datei-Explorer-Suite mit Editor, PDF-Viewer und Datenanalyse"
authors = [{ name = "Lukas Geiger", email = "support@lukasgeiger.com" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
readme = "README.md"

dependencies = [
    "PySide6>=6.5.0,<7.0.0",
    "PyMuPDF>=1.21.0,<2.0.0",
    "pandas>=2.0.0,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0",
]

keywords = [
    "desktop-app",
    "duplicate-files",
    "duplicate-finder",
    "file-browser",
    "file-explorer",
    "file-management",
    "file-manager",
    "fts5",
    "local-first",
    "offline-first",
    "open-bricks",
    "pdf-viewer",
    "privacy",
    "privacy-first",
    "pyside6",
    "python",
    "qt6",
    "suite",
    "windows-desktop",
    "zero-egress",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/file-bricks/ExplorerPro"
Repository = "https://github.com/file-bricks/ExplorerPro.git"
Documentation = "https://github.com/file-bricks/ExplorerPro#readme"
Issues = "https://github.com/file-bricks/ExplorerPro/issues"
"Bug Tracker" = "https://github.com/file-bricks/ExplorerPro/issues"
Changelog = "https://github.com/file-bricks/ExplorerPro/blob/master/CHANGELOG.md"
Security = "https://github.com/file-bricks/ExplorerPro/blob/master/SECURITY.md"
"Security Policy" = "https://github.com/file-bricks/ExplorerPro/blob/master/SECURITY.md"
"Third-Party Licenses" = "https://github.com/file-bricks/ExplorerPro/blob/master/THIRD_PARTY_LICENSES.txt"
"Marketing Log" = "https://github.com/file-bricks/ExplorerPro/blob/master/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/file-bricks"
Umbrella = "https://github.com/open-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/file-bricks/ExplorerPro/blob/master/llms.txt"
Notice = "https://github.com/file-bricks/ExplorerPro/blob/master/NOTICE"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
    "altgraph>=0.17.4",
]
test = [
    "pytest>=9.1.1",
]
build = [
    "PyInstaller>=6.10.0,<7.0.0",
    "pyinstaller-hooks-contrib>=2024.7",
    "altgraph>=0.17.4",
]
legacy-pdf = ["PyPDF2>=3.0.0,<4.0.0"]
legacy-excel = ["xlrd>=2.0.0,<3.0.0"]
windows-shortcuts = ["pywin32>=306; platform_system == 'Windows'"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".pytest_temp",
    ".ruff_cache",
    ".hypothesis",
    "__pycache__",
    "build",
    "dist",
    "releases",
    "_archiv",
    "venv",
    ".venv",
]
addopts = "-ra -v"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "W291", "W293"]
